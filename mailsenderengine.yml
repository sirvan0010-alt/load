name: MailSenderEngine CI

on:
  push:
    branches: [ main ]
    paths:
      - 'MailSenderEngine/**'
      - 'MailSenderEngine.Tests/**'
      - '.github/workflows/mailsenderengine.yml'
  pull_request:
    paths:
      - 'MailSenderEngine/**'
      - 'MailSenderEngine.Tests/**'
      - '.github/workflows/mailsenderengine.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MailSenderEngine.Tests/MailSenderEngine.Tests.csproj

      - name: Build
        run: dotnet build MailSenderEngine.Tests/MailSenderEngine.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test MailSenderEngine.Tests/MailSenderEngine.Tests.csproj --configuration Release --no-build --verbosity normal
